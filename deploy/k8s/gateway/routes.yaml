apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  parentRefs:
    - name: fraud
      namespace: envoy-gateway-system
  hostnames: ["argocd.localhost"]
  rules:
    - backendRefs:
        - name: argocd-server
          port: 80
---
