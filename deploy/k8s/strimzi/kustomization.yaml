apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: fraud
resources:
  - https://github.com/strimzi/strimzi-kafka-operator/releases/download/1.3.1/strimzi-cluster-operator-1.3.1.yaml
patches:
  - target:
      kind: (RoleBinding|ClusterRoleBinding)
    patch: |-
      - op: replace
        path: /subjects/0/namespace
        value: fraud
