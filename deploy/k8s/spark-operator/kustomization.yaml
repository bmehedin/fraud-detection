apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - https://github.com/kubeflow/spark-operator//config/default?ref=v2.6.0
patches:
  - target: {kind: MutatingWebhookConfiguration, name: mutating-webhook-configuration}
    patch: |-
      - {op: replace, path: /webhooks/0/namespaceSelector/matchExpressions/0/values, value: [fraud]}
      - {op: replace, path: /webhooks/1/namespaceSelector/matchExpressions/0/values, value: [fraud]}
      - {op: replace, path: /webhooks/2/namespaceSelector/matchExpressions/0/values, value: [fraud]}
      - {op: replace, path: /webhooks/3/namespaceSelector/matchExpressions/0/values, value: [fraud]}
  - target: {kind: ValidatingWebhookConfiguration, name: validating-webhook-configuration}
    patch: |-
      - {op: replace, path: /webhooks/0/namespaceSelector/matchExpressions/0/values, value: [fraud]}
      - {op: replace, path: /webhooks/1/namespaceSelector/matchExpressions/0/values, value: [fraud]}
      - {op: replace, path: /webhooks/2/namespaceSelector/matchExpressions/0/values, value: [fraud]}
