apiVersion: v1
kind: ConfigMap
metadata:
  name: transaction-producer
data:
  OUTPUT: "kafka"
  KAFKA_BOOTSTRAP_SERVERS: "fraud-kafka-bootstrap:9092"
  RATE: "100"
  CARDS: "1000"
  FRAUD_PERCENT: "1"
  SEED: "42"
  METRICS_PORT: "9401"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: transaction-producer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: transaction-producer
  template:
    metadata:
      labels:
        app: transaction-producer
    spec:
      containers:
        - name: transaction-producer
          image: fraud/transaction-producer:0.1.0
          envFrom:
            - configMapRef:
                name: transaction-producer
          ports:
            - name: metrics
              containerPort: 9401
          readinessProbe:
            httpGet:
              path: /-/healthy
              port: metrics
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: metrics
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests:
              cpu: 250m
              memory: 384Mi
            limits:
              cpu: "1"
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: transaction-producer
spec:
  selector:
    app: transaction-producer
  ports:
    - name: metrics
      port: 9401
      targetPort: metrics
