apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-jobs
data:
  KAFKA_BOOTSTRAP_SERVERS: "kafka:19092"
  REDIS_URI: "redis://redis:6379"
  METRICS_PORT: "9400"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-jobs
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis-jobs
  template:
    metadata:
      labels:
        app: redis-jobs
    spec:
      containers:
        - name: redis-jobs
          image: fraud/redis-jobs:0.1.0
          envFrom:
            - configMapRef:
                name: redis-jobs
          ports:
            - name: metrics
              containerPort: 9400
          readinessProbe:
            httpGet:
              path: /-/healthy
              port: metrics
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: metrics
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests:
              cpu: 250m
              memory: 384Mi
            limits:
              cpu: "1"
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: redis-jobs
spec:
  selector:
    app: redis-jobs
  ports:
    - name: metrics
      port: 9400
      targetPort: metrics
