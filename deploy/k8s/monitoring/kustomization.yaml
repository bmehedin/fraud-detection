apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring
resources:
  - monitors.yaml
  - rules.yaml
generatorOptions:
  disableNameSuffixHash: true
  labels:
    grafana_dashboard: "1"
configMapGenerator:
  - name: dashboard-overview
    files: [dashboards/overview.json]
  - name: dashboard-fast-path
    files: [dashboards/fast-path.json]
  - name: dashboard-slow-path
    files: [dashboards/slow-path.json]
