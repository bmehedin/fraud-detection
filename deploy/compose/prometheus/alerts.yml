groups:
  - name: fraud-detection
    rules:
      - alert: TargetDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.job }} is not reachable"

      - alert: ConsumerLagHigh
        expr: sum by (consumergroup) (kafka_consumergroup_lag) > 1000
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.consumergroup }} lag is {{ $value }}"

      - alert: RedisJobsErrorRate
        expr: |
          sum(rate(redis_jobs_events_total{result="dlq"}[1m]))
            / sum(rate(redis_jobs_events_total[1m])) > 0.05
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "{{ $value | humanizePercentage }} of redis-jobs events go to the DLQ"
